<!DOCTYPE html>
<html lang="zh-hant">

<head>
    <meta charset="UTF-8">
    <!-- C-06: Content Security Policy — 已移除 unsafe-eval（Vue SFC 由 Vite 預編譯） -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;
                   style-src  'self' https://cdn.jsdelivr.net https://fonts.googleapis.com 'unsafe-inline';
                   img-src    'self' data: blob:;
                   font-src   'self' https://fonts.gstatic.com;
                   connect-src 'self' https://*.yzu.edu.tw https://cdn.jsdelivr.net;
                   object-src 'none';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wanna Class Application</title>

    <!-- Bootstrap CSS (CDN，不由 Vite 打包) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-eOJMYsd53ii+scO/bJGFsiCZc+5NDVN2yr8+0RDqr0Ql0h+rP48ckxlpbzKgwra6" crossorigin="anonymous">
    <!-- 其餘 CSS（FontAwesome、wannaclass、components）透過 main.js import 由 Vite 打包 -->
</head>

<body>

    <!-- Vue 掛載點（模板已移至 App.vue，不再有 in-DOM template） -->
    <div id="app"></div>

    <!-- CDN 第三方 JS（設定全域物件，不由 Vite 打包） -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-JEW9xMcG8R+pH31jmWH6WWP0WintQrMb4s7ZOdauHnUtxwoG2vI5DkLtS3qm9Ekf"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

    <!-- Vite 入口（type=module — Vue SFC 已預編譯，不需要 unsafe-eval） -->
    <script type="module" src="./main.js"></script>
</body>

</html>
