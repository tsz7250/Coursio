<!-- 課表 -->
<div ss-container id="section-Schedule" class="inner-section">
    <div class="page-header">
        <h2>📅 我的課表</h2>
        <p>114學年度第1學期課程時間表</p>
    </div>
    
    <div class="schedule-controls">
        <button id="refresh-schedule" class="btn btn-primary" onclick="refreshSchedule()">
            🔄 重新載入課表
        </button>
    </div>

    <div id="schedule-loading" class="schedule-loading">
        <div class="loading-spinner"></div>
        <p>正在載入課表資料...</p>
    </div>

    <div id="schedule-content">
        <div class="schedule-table-container">
            <table class="schedule-table">
                <thead>
                    <tr>
                        <th>時間</th>
                        <th>週一</th>
                        <th>週二</th>
                        <th>週三</th>
                        <th>週四</th>
                        <th>週五</th>
                        <th>週六</th>
                        <th>週日</th>
                    </tr>
                </thead>
                <tbody id="schedule-tbody">
                    <!-- 課表內容將由 JavaScript 動態生成 -->
                </tbody>
            </table>
        </div>
    </div>

    <div id="schedule-error" class="schedule-error">
        <p class="schedule-error-text">❌ 無法載入課表資料</p>
        <button onclick="refreshSchedule()" class="btn btn-secondary">重試</button>
    </div>

    <div class="schedule-info">
        <h4>📋 課表說明</h4>
        <ul>
            <li>點擊「重新載入課表」可更新最新的課程資料</li>
            <li>課表會顯示課程名稱、教室位置和授課教師</li>
            <li>如果沒有課程資料，請確認已正確登入系統</li>
        </ul>
    </div>
</div><!-- End of Schedule ( 課表 ) -->
