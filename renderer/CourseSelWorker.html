<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deprecated - Use Python yzuCourseBot Instead</title>
</head>
<body>
    <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif;">
        <h1>🐍 已升級至 Python yzuCourseBot</h1>
        <p>舊版 JavaScript 選課系統已被替換為更強大的 Python yzuCourseBot</p>
        <p>請使用主介面的「自動選課」功能</p>
        
        <div style="background: #f8f9fa; padding: 20px; border-radius: 8px; margin: 20px auto; max-width: 600px;">
            <h3>✨ 新功能亮點</h3>
            <ul style="text-align: left;">
                <li>🤖 AI 驗證碼自動識別</li>
                <li>🔄 自動重試機制</li>
                <li>📊 即時選課狀態回饋</li>
                <li>⚙️ 靈活的參數設定</li>
                <li>🛡️ 更穩定的選課邏輯</li>
            </ul>
        </div>
        
        <p style="color: #666;">
            此頁面已不再使用，請關閉視窗並使用主介面的自動選課功能
        </p>
    </div>
    
    <script>
        // 通知主程序此視窗已不再使用
        if (typeof require !== 'undefined') {
            const { ipcRenderer } = require('electron');
            ipcRenderer.send('deprecatedWorkerAccessed');
        }
        
        // 3秒後自動關閉視窗
        setTimeout(() => {
            if (window.close) {
                window.close();
            }
        }, 3000);
    </script>
</body>
</html>
