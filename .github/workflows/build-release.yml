name: Build and Release
on:
  push:
    branches: [ main, fix-CICD ]
  pull_request:
    branches: [ main, fix-CICD ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: Coursio-Windows
            artifact_path: build/win/*.exe
          - os: macos-26
            artifact_name: Coursio-macOS-AppleSilicon
            artifact_path: |
              build/mac/*.dmg
              build/mac/*.zip
          - os: macos-26-intel
            artifact_name: Coursio-macOS-Intel
            artifact_path: |
              build/mac/*.dmg
              build/mac/*.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer
        run: npm run build:renderer

      - name: Smoke
        run: npm run smoke

      - name: Audit
        run: npm run audit

      - name: Build Electron App
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
